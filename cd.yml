name: URL Shortener CD (Deploy)

# Trigger deployment on every push to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        # Requires DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD secrets
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Backend Image
        # Build the container and push it to Docker Hub registry
        uses: docker/build-push-action@v5
        with:
          context: ./UrlShortenerService
          file: ./UrlShortenerService/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener-be:latest

      - name: Build and Push Frontend Image
        # Build the client container and push it to Docker Hub registry
        uses: docker/build-push-action@v5
        with:
          context: ./urlshortener.client
          file: ./urlshortener.client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener-fe:latest

      - name: Trigger Render Deployment
        # Send a POST request to Render Deploy Hook to refresh the services
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}