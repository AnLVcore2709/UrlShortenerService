
name: URL Shortener CD (Deploy)

on:
  push:
    branches: [ "main" ]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./UrlShortenerService
          file: ./UrlShortenerService/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/url-shortener-be:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./urlshortener.client
          file: ./urlshortener.client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/url-shortener-fe:latest
